# The shop's API gateway: tinyproxy with tinygateway, as "High-level
# architecture" in DESIGN.md describes. From tinyAmazon/:
#   tinyproxy/tinyproxy -c shop/gateway.conf

http {
    python_path .;
    python_module tinygateway;

    upstream auth {
        host 127.0.0.1:8001;
        keepalive_max_idle 16;
    }
    upstream items {
        host 127.0.0.1:8002;
        keepalive_max_idle 16;
    }
    upstream search {
        host 127.0.0.1:8003;
        keepalive_max_idle 16;
    }
    upstream orders {
        host 127.0.0.1:8004;
        keepalive_max_idle 16;
    }

    server {
        listen 8000;
        access_log /dev/stdout;

        proxy_http_version 1.1;
        # No location sets its own, or it would inherit none of these,
        # and a client's X-User-Id would get through.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_set_header X-User-Id "";

        python_setting plugins "cors";
        # The frontend's pages, from shop/frontend.py.
        python_setting cors_origins "http://localhost:8080";
        python_setting cors_methods "GET, POST";
        python_setting cors_headers "Authorization, Content-Type, Idempotency-Key";
        python_setting cors_max_age 600;

        location = /users {
            proxy_pass http://auth;
        }
        location = /login {
            proxy_pass http://auth;
        }
        location = /search {
            proxy_pass http://search;
        }
        location = /listings {
            # cors first, so a preflight, which has no token, gets through.
            python_setting plugins "cors jwt";
            proxy_pass http://items;
        }
        location = /orders {
            python_setting plugins "cors jwt";
            proxy_pass http://orders;
        }
    }
}
