# The shop's API gateway: tinyproxy with tinygateway, as "High-level
# architecture" in DESIGN.md describes. From tinyAmazon/:
#   tinyproxy/tinyproxy -c shop/gateway.conf

http {
    python_path .;
    python_module tinygateway;

    upstream auth {
        host 127.0.0.1:8001;
        keepalive_max_idle 16;
    }
    upstream items {
        host 127.0.0.1:8002;
        keepalive_max_idle 16;
    }
    upstream search {
        host 127.0.0.1:8003;
        keepalive_max_idle 16;
    }
    upstream orders {
        host 127.0.0.1:8004;
        keepalive_max_idle 16;
    }

    server {
        listen 8000;
        access_log /dev/stdout;

        proxy_http_version 1.1;
        # No location sets its own, or it would inherit none of these,
        # and a client's X-User-Id would get through.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_set_header X-User-Id "";

        location = /users {
            proxy_pass http://auth;
        }
        location = /login {
            proxy_pass http://auth;
        }
        location = /search {
            proxy_pass http://search;
        }
        location = /listings {
            python_setting plugins "jwt";
            proxy_pass http://items;
        }
        location = /orders {
            python_setting plugins "jwt";
            proxy_pass http://orders;
        }
    }
}
